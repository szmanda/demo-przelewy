services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: przelewy_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: 3f958f27cf17b07dfb9d4243a492823a
      DATABASE_URL: "postgresql://przelewy_user:przelewy_pass@postgres:5432/przelewy_db?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - przelewy_network

  messenger_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: przelewy_messenger_worker
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: 3f958f27cf17b07dfb9d4243a492823a
      DATABASE_URL: "postgresql://przelewy_user:przelewy_pass@postgres:5432/przelewy_db?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - przelewy_network

  web:
    image: nginx:alpine
    container_name: przelewy_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - przelewy_network

  postgres:
    image: postgres:16.6-alpine
    container_name: przelewy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: przelewy_db
      POSTGRES_USER: przelewy_user
      POSTGRES_PASSWORD: przelewy_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U przelewy_user -d przelewy_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - przelewy_network

  redis:
    image: redis:7
    container_name: przelewy_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - przelewy_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: przelewy_rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - przelewy_network

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: przelewy_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - przelewy_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  przelewy_network:
    driver: bridge
